<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Word & Character Counter | Online Text Utils</title>
    <meta name="description" content="Free online text utility tool to count words, characters, sentences, convert case, and format text instantly. Remove extra spaces and line breaks.">
    <link rel="canonical" href="https://text-tools.corelumetech.in/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://text-tools.corelumetech.in/">
    <meta property="og:title" content="Free Word & Character Counter | Online Text Utils">
    <meta property="og:description" content="Free online text utility tool to count words, characters, sentences, convert case, and format text instantly. Remove extra spaces and line breaks.">
    <meta property="og:image" content="https://text-tools.corelumetech.in/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://text-tools.corelumetech.in/">
    <meta property="twitter:title" content="Free Word & Character Counter | Online Text Utils">
    <meta property="twitter:description" content="Free online text utility tool to count words, characters, sentences, convert case, and format text instantly. Remove extra spaces and line breaks.">
    <meta property="twitter:image" content="https://text-tools.corelumetech.in/og-image.jpg">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Text Utils",
      "url": "https://text-tools.corelumetech.in/",
      "description": "Free online text utility to count words, convert case, and format text instantly.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://quge5.com/88/tag.min.js" data-zone="266628" async data-cfasync="false"></script>
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
</head>
<body>
    <div class="app-container">


        <header class="header">
            <h1><i class="fa-solid fa-text-height"></i> Text Utils</h1>
            <p>Count, format, and manipulate your text instantly.</p>
        </header>

        <main class="main-content">
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Words</span>
                    <span class="stat-value" id="word-count">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Characters</span>
                    <span class="stat-value" id="char-count">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Sentences</span>
                    <span class="stat-value" id="sentence-count">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Paragraphs</span>
                    <span class="stat-value" id="paragraph-count">0</span>
                </div>
            </div>

            <div class="editor-container">
                <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="btn-uppercase" title="UPPERCASE"><i class="fa-solid fa-font"></i> Upper</button>
                    <button class="btn btn-primary" id="btn-lowercase" title="lowercase"><i class="fa-solid fa-a"></i> Lower</button>
                    <button class="btn btn-primary" id="btn-titlecase" title="Title Case"><i class="fa-solid fa-text-width"></i> Title</button>
                    <button class="btn btn-secondary" id="btn-rem-spaces" title="Remove extra spaces"><i class="fa-solid fa-compress"></i> Trim Spaces</button>
                    <button class="btn btn-secondary" id="btn-rem-lines" title="Remove line breaks"><i class="fa-solid fa-align-justify"></i> Single Line</button>
                    <button class="btn btn-copy" id="btn-copy"><i class="fa-regular fa-copy"></i> Copy</button>
                    <button class="btn btn-danger" id="btn-clear"><i class="fa-solid fa-trash-can"></i> Clear</button>
                </div>
            </div>
            
            <div class="bottom-layout">

                <!-- Reading Time Info -->
                <div class="info-card">
                    <h3>Reading & Speaking</h3>
                    <p>Estimated Reading Time: <span id="read-time">0 min</span></p>
                    <p>Estimated Speaking Time: <span id="speak-time">0 min</span></p>
                </div>
            </div>
        </main>


    </div>
    <!-- Toast Notification -->
    <div id="toast" class="toast">Copied to clipboard!</div>
    <script src="script.js"></script>
</body>
</html>
